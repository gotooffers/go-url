<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .err { color: #b91c1c; font-size: 13px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Redirecting...</h1>
    <p id="status-msg">Preparing secure redirect without referrer headers...</p>
    <a id="continue-link" class="btn" href="https://example.com/landing" rel="noreferrer noopener">Continue</a>
    <div id="err-msg" class="err"></div>
  </div>
  <script>
    (function () {
      var FALLBACK_URL = "https://example.com/landing";
      var IS_DYNAMIC = true;
      var USE_DOUBLE_HOP = false;
      var STRIP_TRACKING = true;
      var CLEAN_HISTORY = true;
      var DELAY_MS = 0;
      var ALLOWED_DOMAINS = [];
      var TRACKING_KEYS = ["utm_source","utm_medium","utm_campaign","utm_term","utm_content","utm_id","fbclid","gclid","gbraid","wbraid","msclkid","ttclid","twclid","yclid","mc_cid","mc_eid","igshid","ref","ref_src","source","src"];

      function decodeB64Url(str) {
        var b64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      function sanitizeUrl(raw) {
        try {
          var parsed = new URL(String(raw).trim());
          if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return null;
          if (STRIP_TRACKING) {
            var toRemove = [];
            parsed.searchParams.forEach(function (_v, k) {
              var lower = k.toLowerCase();
              if (lower.indexOf('utm_') === 0 || TRACKING_KEYS.indexOf(lower) !== -1) {
                toRemove.push(k);
              }
            });
            for (var i = 0; i < toRemove.length; i++) {
              parsed.searchParams.delete(toRemove[i]);
            }
          }
          if (ALLOWED_DOMAINS.length > 0) {
            var host = parsed.hostname.toLowerCase();
            var ok = ALLOWED_DOMAINS.some(function (d) {
              return host === d || host.endsWith('.' + d);
            });
            if (!ok) return null;
          }
          return parsed.toString();
        } catch (_e) {
          return null;
        }
      }

      function resolveTarget() {
        if (!IS_DYNAMIC) return sanitizeUrl(FALLBACK_URL);
        var hash = window.location.hash || '';
        var match = hash.match(/[#&]?u=([^&]+)/);
        if (match && match[1]) {
          try {
            var decoded = decodeB64Url(decodeURIComponent(match[1]));
            var validated = sanitizeUrl(decoded);
            if (validated) return validated;
            return null;
          } catch (_e) {
            return null;
          }
        }
        var params = new URLSearchParams(window.location.search);
        var qUrl = params.get('url') || params.get('u');
        if (qUrl) return sanitizeUrl(qUrl);
        return sanitizeUrl(FALLBACK_URL);
      }

      function executeRedirect(target) {
        var link = document.getElementById('continue-link');
        if (link) link.setAttribute('href', target);

        if (CLEAN_HISTORY && window.history && window.history.replaceState) {
          try {
            window.history.replaceState(null, '', window.location.pathname);
          } catch (_e) {}
        }

        if (USE_DOUBLE_HOP && window.Blob && window.URL && window.URL.createObjectURL) {
          try {
            var safeJson = JSON.stringify(target);
            var safeAttr = target.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
            var hopHtml =
              '<!doctype html><html><head>' +
              '<meta charset="utf-8">' +
              '<meta name="referrer" content="no-referrer">' +
              '<meta http-equiv="Referrer-Policy" content="no-referrer">' +
              '<meta http-equiv="refresh" content="0;url=' + safeAttr + '">' +
              '<script>window.location.replace(' + safeJson + ');<\/script>' +
              '</head><body></body></html>';
            var blob = new Blob([hopHtml], { type: 'text/html' });
            var blobUrl = window.URL.createObjectURL(blob);
            window.location.replace(blobUrl);
            return;
          } catch (_e) {}
        }

        window.location.replace(target);
      }

      var targetUrl = resolveTarget();
      if (!targetUrl) {
        var errEl = document.getElementById('err-msg');
        var msgEl = document.getElementById('status-msg');
        if (msgEl) msgEl.textContent = 'Destination could not be verified.';
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = 'Invalid or disallowed destination URL.';
        }
        return;
      }

      if (DELAY_MS > 0) {
        setTimeout(function () {
          executeRedirect(targetUrl);
        }, DELAY_MS);
      } else {
        executeRedirect(targetUrl);
      }
    })();
  </script>
</body>
</html>
